<h1>T764295 间隔约束取权最大值</h1>
<h2>题目背景</h2>
<p>豆包</p>
<h2>题目描述</h2>
<p>给定长度为n的权值序列，从中挑选若干元素。
挑选约束：任意两个被选中元素的下标差值不能小于给定距离d。
计算可以选出的元素总和的最大数值。</p>
<h2>输入格式</h2>
<p>第一行两个整数 n,d
第二行n个整数，代表序列每个位置的权值</p>
<h2>输出格式</h2>
<p>输出一个整数，表示选取元素能得到的最大权值总和</p>
<h2>输入输出样例 #1</h2>
<h3>输入 #1</h3>
<pre><code>6 2
5 1 3 4 2 6
</code></pre>
<h3>输出 #1</h3>
<pre><code>11
</code></pre>
<h2>说明/提示</h2>
<p>$1\le n \le3000,1\le d\le n,-10^4\le val\le 10^4$</p>
